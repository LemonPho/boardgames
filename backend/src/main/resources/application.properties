# Application
spring.application.name=boardgames
spring.profiles.default=dev,local
server.port=8080
server.forward-headers-strategy=framework

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/boardgamesdb
spring.datasource.username=boardgames_user
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=3600
jwt.refresh-expiration=2592000

# Email
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=motomutterersboardgames@gmail.com
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.verification-expiration=900

room-invitation.expiration=600
room.waiting.expiration=900
room.in-progress.expiration=3600
